[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-team-dev"
version = "0.1.0"
description = "Antigravity 2.0 Multi-Agent Matrix Dev Team Workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["src/backend/tests", "src/db/tests"]
addopts = "-v --tb=short"
markers = [
    "asyncio: mark test as asyncio coroutine",
    "anyio: mark test to run with anyio",
    "postgres_only: mark test as requiring a live PostgreSQL instance (e.g. for pgvector, tsvector, array operators)",
    "sqlite_compatible: mark test as compatible with both SQLite in-memory and PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults (needed for FastAPI Depends)
]
