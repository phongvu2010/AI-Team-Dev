# ==============================================================================
# CẤU HÌNH ĐỊNH TUYẾN MÔ HÌNH AI & TỐI ƯU HÓA TOKEN (MODEL ROUTER MATRIX)
# Antigravity 2.0 Multi-Agent Matrix Dev Team (AI-Team-Dev)
# ==============================================================================

tiers:
  pro:
    default_model: "gemini-2.5-pro"
    nextgen_model: "gemini-3.8-pro"
    env_override_key: "GEMINI_PRO_MODEL"
    description: "Mô hình nhận thức bậc cao (High-reasoning): Thiết kế kiến trúc phân tầng, phân tích bảo mật STRIDE/OWASP, ma trận dữ liệu 3 tầng và Code Review chuyên sâu."
    relative_cost_factor: 5.0
    recommended_tasks:
      - "Lập kế hoạch kỹ thuật & Ma trận ánh xạ dữ liệu 3 tầng (planner)"
      - "Code Review chuyên sâu & Thẩm định an ninh OWASP Top 10 (code-reviewer)"
      - "Phân tích mô hình đe dọa STRIDE & Ma trận RBAC"
      - "Khắc phục các lỗi logic nghiệp vụ phức tạp (backend-dev deep refactor)"

  flash:
    default_model: "gemini-2.5-flash"
    nextgen_model: "gemini-3.8-flash"
    env_override_key: "GEMINI_FLASH_MODEL"
    description: "Cân bằng tối ưu giữa tốc độ siêu tốc, độ chuẩn xác cấu trúc và chi phí tiết kiệm. Sẵn sàng cho Gemini 3.8 Flash."
    relative_cost_factor: 1.0
    recommended_tasks:
      - "Phỏng vấn người dùng & Bóc tách PRD + Gherkin BDD Scenarios (ba)"
      - "Lập trình Database Models, Repositories & Alembic Migrations (db-dev)"
      - "Lập trình Giao diện Web Next.js/Vite & Mobile React Native (frontend-dev)"
      - "Lập trình REST API FastAPI & Pydantic v2 (backend-dev)"
      - "Điều phối kiểm thử Pytest, đo độ phủ và bóc tách lỗi micro-patch (qa-tester)"

  flash_lite:
    default_model: "gemini-2.5-flash-lite"
    nextgen_model: "gemini-3.8-flash-lite"
    env_override_key: "GEMINI_FLASH_LITE_MODEL"
    description: "Tốc độ xử lý tức thì, chi phí token tối thiểu (-90% vs Pro), chuyên trách tổng hợp tài liệu và quét cú pháp."
    relative_cost_factor: 0.25
    recommended_tasks:
      - "Lập bảng kiểm thử nghiệm thu người dùng cuối (UAT_CHECKLIST.md)"
      - "Soạn thảo cẩm nang vận hành (USER_MANUAL.md)"
      - "Đóng gói Release Manifest và tính mã băm SHA-256 (bundle_release.py)"
      - "Quét tĩnh regex bí mật (secret-scanner)"
      - "Định dạng và kiểm tra linter cú pháp"

# Phân bổ chi tiết theo từng Tác tử Chuyên trách (Subagents)
agents:
  ba:
    name: "Business Analyst & Requirements Engineer"
    default_tier: "flash"
    recommended_model: "gemini-2.5-flash"
    env_override_key: "BA_MODEL"
    rationale: "Bóc tách PRD, phỏng vấn tương tác và sinh Gherkin BDD kịch bản mẫu cần tốc độ nhanh và cấu trúc JSON chuẩn."

  planner:
    name: "System Architect & Technical Planner"
    default_tier: "pro"
    recommended_model: "gemini-2.5-pro"
    env_override_key: "PLANNER_MODEL"
    rationale: "Thiết kế kiến trúc hệ thống, ma trận dữ liệu 3 tầng (DB <-> API <-> UI) và phòng chống drift đòi hỏi tư duy kiến trúc bậc cao."

  db-dev:
    name: "Database Engineer (PostgreSQL / SQLAlchemy)"
    default_tier: "flash"
    recommended_model: "gemini-2.5-flash"
    env_override_key: "DB_DEV_MODEL"
    rationale: "Xây dựng schema SQLAlchemy 2.0 và Alembic migrations tuân thủ chặt chẽ theo plan.md, mô hình Flash cho kết quả nhanh và chính xác."

  frontend-dev:
    name: "Frontend & Mobile Engineer (Next.js / Vite / Expo)"
    default_tier: "flash"
    recommended_model: "gemini-2.5-flash"
    env_override_key: "FRONTEND_DEV_MODEL"
    rationale: "Xây dựng UI screens, Tailwind CSS layouts, 4 UI states và API client typed theo OpenAPI contract."

  backend-dev:
    name: "Backend Engineer (FastAPI / Pydantic v2)"
    default_tier: "pro"
    recommended_model: "gemini-2.5-pro"
    env_override_key: "BACKEND_DEV_MODEL"
    rationale: "Triển khai async business logic, dependency injection, exception handling và kết nối DB an toàn."

  qa-tester:
    name: "QA & Testing Specialist"
    default_tier: "flash"
    recommended_model: "gemini-2.5-flash"
    env_override_key: "QA_MODEL"
    rationale: "Chạy Pytest, Jest/E2E runner, kiểm tra độ phủ >=80%, và bóc tách traceback thành micro-patch tickets."

  code-reviewer:
    name: "Principal Code Reviewer & Security Auditor"
    default_tier: "pro"
    recommended_model: "gemini-2.5-pro"
    env_override_key: "CODE_REVIEW_MODEL"
    rationale: "Đánh giá chất lượng mã nguồn qua git diff, thẩm định OWASP Top 10 và STRIDE Threat Model."
